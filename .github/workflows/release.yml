name: Build and release

# Push a tag such as v1.1.0 to build every version, test it and publish a GitHub release.
# You can also start it by hand from the Actions tab to test the builds (no release is made).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests run on every system before anything is built. If one fails, nothing is built or published.
  test:
    name: Tests ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-py3.13,   os: windows-latest, python: "3.13"}
          - {name: windows-py3.8,    os: windows-latest, python: "3.8"}
          - {name: linux-py3.13,     os: ubuntu-22.04,   python: "3.13"}
          - {name: linux-py3.8,      os: ubuntu-22.04,   python: "3.8"}
          - {name: macos-arm64-py3.13,  os: macos-15,       python: "3.13"}
          - {name: macos-x86_64-py3.13, os: macos-15-intel, python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Linux - install Tk (for the window) and a virtual screen (for the window tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk-dev xvfb

      - name: Check that tkinter works
        run: python -c "import tkinter; tkinter.Tcl(); print('Tk', tkinter.TkVersion)"

      # Python 3.8 is also run for real above. This reads every file as Python 3.8 would,
      # so a newer syntax is caught on every system, including those without a 3.8 runner.
      - name: Check the code reads as Python 3.8
        shell: bash
        run: |
          python - <<'PY'
          import ast, glob
          files = ["treerot.py"] + sorted(glob.glob("tests/*.py")) + ["tools/make_icons.py"]
          for name in files:
              with open(name, encoding="utf-8") as f:
                  ast.parse(f.read(), name, feature_version=(3, 8))
          print("Python 3.8 syntax OK:", len(files), "files")
          PY

      - name: Unit tests (Linux, with a virtual screen)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Unit tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      # The unit tests use pretend browsers. This one uses the real browser on the machine
      # (Edge on Windows, Chrome on the macOS and Linux runners) and checks the PDF it writes.
      - name: PDF made by a real browser
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p pdfcheck/alpha/beta && echo hello > pdfcheck/alpha/beta/file.txt
          python - <<'PY'
          import os, subprocess, sys
          import treerot

          def say(text):
              print(text)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as f:
                      f.write(text + "\n\n")

          system = os.environ.get("RUNNER_OS", sys.platform)
          browsers = treerot.find_browsers()
          if not browsers:
              text = f"NO BROWSER FOUND on {system}: the real PDF check did not run on this machine."
              if system == "Windows":
                  print("::error::" + text)
                  say(text)
                  sys.exit(1)       # Edge ships with Windows, so its absence is a problem
              print("::warning::" + text)
              say(text)
              sys.exit(0)
          print("Browsers found, in the order TreeRot tries them:", browsers)
          out = "pdfcheck.pdf"
          if os.path.exists(out):
              os.remove(out)
          r = subprocess.run([sys.executable, "treerot.py", "pdfcheck", "--format", "summary",
                              "--progress", "none", "--report", out], timeout=420)
          if r.returncode != 0 or not os.path.isfile(out):
              print("::error::TreeRot did not produce the PDF (exit %s)" % r.returncode)
              sys.exit(1)
          with open(out, "rb") as f:
              data = f.read()
          if not data.startswith(b"%PDF-") or b"%%EOF" not in data[-1024:] or len(data) < 1500:
              print("::error::The file is not a complete PDF (%d bytes)" % len(data))
              sys.exit(1)
          say(f"Real PDF OK on {system}: {len(data)} bytes, first browser tried: {browsers[0]}")
          PY

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-22.04          # older glibc, so the binary runs on more distributions
          - name: macos-arm64
            os: macos-15              # Apple Silicon
          - name: macos-x86_64
            os: macos-15-intel        # Intel Macs (GitHub supports this until fall 2027)
    env:
      PYTHON: python                  # the build scripts use the Python set up below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('treerot.py', encoding='utf-8').read()).group(1))")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $v in treerot.py"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Linux - install Tk (for the window) and a virtual screen (for the test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk-dev xvfb

      - name: Check that tkinter works
        run: python -c "import tkinter; tkinter.Tcl(); print('Tk', tkinter.TkVersion)"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_exe.bat

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash build.sh

      # ---------- tests: every program must start and scan a folder ----------
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & dist\release\TreeRot-cli.exe . --format summary --report smoke.html
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.html)) { throw "Command-line test failed" }
          # the windowed exe must still accept the older --cli form
          $p = Start-Process dist\release\TreeRot.exe -ArgumentList '--cli', '.', '-o', 'smoke.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.csv)) { throw "--cli test failed" }
          # the window must open and stay open
          $g = Start-Process dist\release\TreeRot.exe -PassThru
          Start-Sleep -Seconds 8
          if ($g.HasExited) { throw "The window closed by itself (exit code $($g.ExitCode))" }
          Stop-Process -Id $g.Id -Force
          Write-Host "Windows tests OK"

      # S4U logon needs no password, which also means this cannot reach network shares and does
      # not test Password logon: it proves the task XML, /Run and the status file.
      - name: Test a real background task
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import treerot,os; open('t.xml','w',encoding='utf-16').write(treerot.build_task_xml(os.path.abspath('dist/release/TreeRot-cli.exe'), [os.getcwd(), '--format', 'summary', '-q', '--progress', 'none', '--report', os.path.abspath('bg.html'), '--status-file', os.path.abspath('bg.json')], os.environ['USERDOMAIN'] + '\\' + os.environ['USERNAME'], logon_type='S4U'))"
          if ($LASTEXITCODE -ne 0) { throw "The task XML could not be built" }
          schtasks /Create /TN TreeRot-ci /XML t.xml /F
          if ($LASTEXITCODE -ne 0) { throw "The task could not be created" }
          try {
            schtasks /Run /TN TreeRot-ci
            if ($LASTEXITCODE -ne 0) { throw "The task could not be started" }
            $state = ""
            for ($i = 0; $i -lt 90 -and $state -ne "finished" -and $state -ne "failed"; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path bg.json) {
                try { $state = (Get-Content bg.json -Raw | ConvertFrom-Json).state } catch { }
              }
            }
            # What the panel reads for a task that never started: Last Result is the 7th column.
            schtasks /Query /TN TreeRot-ci /V /FO CSV /NH
            if (Test-Path bg.json) { Get-Content bg.json }
            if ($state -ne "finished") { throw "The background task ended in state '$state'" }
            if (-not (Test-Path bg.html)) { throw "The background task produced no report" }
          } finally {
            schtasks /Delete /TN TreeRot-ci /F
          }

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          mkdir t && tar -xzf dist/release/treerot-linux-x86_64.tar.gz -C t
          ./t/treerot . --format summary --report smoke.html
          test -s smoke.html
          rc=0; timeout 8 xvfb-run -a ./t/treerot || rc=$?
          if [ "$rc" -ne 124 ]; then echo "::error::The window did not stay open (exit $rc)"; exit 1; fi
          echo "Linux tests OK"

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          zip=$(ls dist/release/TreeRot-macos-*.zip)
          mkdir t && ditto -x -k "$zip" t
          ./t/TreeRot/treerot . --format summary --report smoke.html
          test -s smoke.html
          file t/TreeRot/treerot
          echo "macOS command-line test OK"

      - name: Test the macOS window (informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./t/TreeRot/TreeRot.app/Contents/MacOS/TreeRot &
          pid=$!; sleep 8
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "macOS window test OK"; else echo "::warning::The app closed by itself"; exit 1; fi

      - name: Test the PDF report with the browser on this machine (informational)
        continue-on-error: true
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/release/TreeRot-cli.exe ;;
            Linux)   exe=./t/treerot ;;
            macOS)   exe=./t/TreeRot/treerot ;;
          esac
          "$exe" . --format summary --report smoke.pdf
          head -c 5 smoke.pdf | grep -q '%PDF-' && echo "PDF report OK ($(wc -c < smoke.pdf) bytes)"

      - name: Test a very large PDF report with Edge, all levels (informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os
          for i in range(120):                      # 12,000 folders, 3 levels deep
              for j in range(100):
                  d = f"big/area{i:03d}/project{j:03d}"
                  os.makedirs(d, exist_ok=True)
                  with open(f"{d}/file.txt", "w") as f:
                      f.write("x")
          PY
          start=$(date +%s)
          dist/release/TreeRot-cli.exe big --format summary --report big.pdf --report-tree all
          head -c 5 big.pdf | grep -q '%PDF-'
          echo "Large PDF OK: $(wc -c < big.pdf) bytes in $(( $(date +%s) - start )) s"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # needed to create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Create the checksum file
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
